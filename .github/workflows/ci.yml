name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,lerobot,hub]"

      - name: Check version metadata
        run: python scripts/check_version.py

      - name: Lint
        if: matrix.python-version == '3.9'
        run: ruff check openbot_data tests examples

      - name: Type check
        if: matrix.python-version == '3.9'
        run: mypy openbot_data

      - name: Run tests
        run: pytest -v

      - name: Check package build
        run: |
          pip install build twine
          python -m build
          python -m twine check dist/*

  official-lerobot-conformance:
    runs-on: ubuntu-latest
    env:
      OPENBOT_DATA_OFFICIAL_CONFORMANCE: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned official LeRobot
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,lerobot,hub]"
          python -m pip install "lerobot[dataset]==0.6.0"

      - name: Run official writer and loader conformance
        run: pytest -q tests/test_official_lerobot_conformance.py
